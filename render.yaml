services:
  - type: web
    name: cinestream
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python ml/train.py
    startCommand: gunicorn app:app --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "false"
